<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ORION — Autonomous Financial Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
:root{
--bg:#070809; --panel:#0c0e11; --panel-2:#101317; --line:#1a1e25;
--ink:#e7ecf3; --muted:#8a93a3; --dim:#5b6373;
--accent:#7dd3fc; --accent-2:#c4b5fd; --green:#34d399; --red:#fb7185; --amber:#fbbf24;
}
html,body{background:var(--bg); color:var(--ink); font-family:'Geist',ui-sans-serif,system-ui,sans-serif;}
.font-mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;}
.font-serif{font-family:'Instrument Serif',serif; font-style:italic;}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.005)); border:1px solid var(--line); backdrop-filter:blur(14px);}
.hairline{border-color:var(--line);}
.ticker-up{color:var(--green);} .ticker-dn{color:var(--red);}
</style>
</head>

<body class="min-h-screen grain">

<header class="relative z-10 border-b hairline">
<div class="flex items-center gap-4 px-5 py-3">

<div class="flex items-center gap-2">
<div class="w-7 h-7 rounded-md grid place-items-center" style="background:radial-gradient(circle at 30% 30%,#7dd3fc,#1e3a8a)">
<span class="font-mono text-[10px] font-bold text-slate-900">OR</span>
</div>
<div>
<div class="font-mono text-[13px] tracking-[0.18em]">ORION<span class="text-slate-500">/INTEL</span></div>
<div class="font-mono text-[10px] text-slate-500 -mt-0.5">AUTONOMOUS FINANCIAL INTELLIGENCE · v0.9</div>
</div>
</div>

<div class="flex-1"></div>

<div id="clock" class="font-mono text-[11px] text-slate-400">—</div>

</div>
</header>

<section class="p-5">
<div class="glass p-4 rounded-xl">
<div class="font-mono" id="sel-ticker">—</div>
<div id="sel-price">—</div>
<div id="sel-change">—</div>
</div>

<canvas id="priceChart" height="180"></canvas>

<div id="signal-list">—</div>
<div id="filings">—</div>
<div id="news">—</div>
</section>

<script>
const API = "https://1orionmax-production.up.railway.app/api";

let UNIVERSE = [];
let SELECTED = null;
let PRICE_CHART = null;
let CURRENT_RANGE = '6mo';

const $ = (id) => document.getElementById(id);

const fmt = (n, d=2) =>
(n===null||n===undefined||Number.isNaN(n)) ? '—' :
Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});

const fmtCompact = (n) => {
if (n==null) return '—';
const a=Math.abs(n);
if(a>=1e12) return (n/1e12).toFixed(2)+'T';
if(a>=1e9) return (n/1e9).toFixed(2)+'B';
if(a>=1e6) return (n/1e6).toFixed(2)+'M';
if(a>=1e3) return (n/1e3).toFixed(2)+'K';
return n.toFixed(0);
};

const clsChange = (n) => n>=0 ? 'ticker-up' : 'ticker-dn';

function clock(){
const d = new Date();
const el = $('clock');
if(el) el.textContent = d.toUTCString().replace('GMT','UTC');
}
setInterval(clock, 1000); clock();

async function getJSON(url){
const r = await fetch(url);
if(!r.ok) throw new Error(url);
return r.json();
}

/* ---------------- SAFE INIT ---------------- */
async function init(){
try{
const u = await getJSON(`${API}/orion/universe`);
UNIVERSE = u?.companies || [];

// safe DOM writes
$('sel-ticker') && ($('sel-ticker').textContent = 'Loading...');

SELECTED = UNIVERSE.find(c=>c.ticker==='NVDA') || UNIVERSE[0];

if(!SELECTED) return;

await Promise.all([
loadDashboard(SELECTED.ticker),
loadNews(),
pollAgents()
]);

}catch(e){
console.error("init failed", e);
}
}

/* ---------------- DASHBOARD ---------------- */
async function loadDashboard(ticker){
try{
const d = await getJSON(`${API}/orion/dashboard/${ticker}`);

renderQuote(d?.quote || {});
renderChart(d?.chart || {timestamps:[],closes:[]});
renderSignals(d?.signals || {});
renderFilings(d?.filings || []);

$('sel-ticker') && ($('sel-ticker').textContent = ticker);

}catch(e){
console.error("dashboard error", e);
}
}

/* ---------------- QUOTE ---------------- */
function renderQuote(q={}){
$('sel-price') && ($('sel-price').textContent = fmt(q.price));
$('sel-change') && ($('sel-change').textContent =
`${fmt(q.change)} (${(q.changePct||0).toFixed(2)}%)`);
}

/* ---------------- CHART FIX ---------------- */
function renderChart(c={}){
try{
if(!c?.timestamps || !c?.closes) return;

const ctx = $('priceChart')?.getContext('2d');
if(!ctx) return;

if(PRICE_CHART) PRICE_CHART.destroy();

PRICE_CHART = new Chart(ctx,{
type:'line',
data:{
labels:c.timestamps.map(t=>new Date(t*1000).toLocaleDateString()),
datasets:[{
data:c.closes,
borderColor:'#7dd3fc',
fill:false,
tension:0.25,
pointRadius:0
}]
},
options:{responsive:true}
});

}catch(e){
console.error("chart error", e);
}
}

/* ---------------- SIGNALS FIX ---------------- */
function renderSignals(s={}){
const el = $('signal-list');
if(!el) return;

const list = s.signals || [];

el.innerHTML = list.length ? list.map(x=>`
<div>[${x.type}] ${x.label}</div>
`).join('') : 'No signals';
}

/* ---------------- FILINGS FIX ---------------- */
function renderFilings(filings=[]){
const el = $('filings');
if(!el) return;

el.innerHTML = filings.length ? filings.map(f=>`
<div>${f.form || ''}</div>
`).join('') : 'No filings';
}

/* ---------------- NEWS FIX ---------------- */
async function loadNews(){
try{
const {news=[]} = await getJSON(`${API}/orion/news`);
const el = $('news');
if(el) el.innerHTML = news.map(n=>`<div>${n.title}</div>`).join('');
}catch(e){
console.warn("news error", e);
}
}

/* ---------------- AGENTS FIX ---------------- */
async function pollAgents(){
try{
const {events=[]} = await getJSON(`${API}/orion/agents/activity`);
const el = $('agent-stream');
if(!el) return;

el.innerHTML = events.map(e=>`<div>${e.action}</div>`).join('');
}catch(e){}
}

/* ---------------- WATCH SAFE ---------------- */
function refreshAll(){
if(SELECTED) loadDashboard(SELECTED.ticker);
loadNews();
}

window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
